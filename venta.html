<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zentrum - Inmuebles en Venta</title>
    <!-- Fuentes e Iconos -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- ESTILOS BASE Y VARIABLES (COLORES NEGRO Y ROJO) --- */
        :root {
            --primary-red: #e63946;
            --dark-red: #b81d24;
            --main-black: #111111;
            --card-black: #1a1a1a;
            --bg-dark: #0a0a0a;
            --text-light: #f4f4f4;
            --text-muted: #a0a0a0;
            --border-color: #2a2a2a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* --- 1. NAVBAR SUPERIOR --- */
        header {
            border-bottom: 1px solid var(--border-color);
            background: var(--main-black);
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .logo span { color: var(--primary-red); }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        .nav-menu a {
            color: var(--text-light);
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-menu a:hover {
            color: var(--primary-red);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-publish {
            background-color: var(--primary-red);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-publish:hover {
            background-color: var(--dark-red);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--text-light);
            font-weight: 500;
        }

        /* --- CONTENEDOR ANIMADO DEL FORMULARIO OCULTO --- */
        .form-wrapper {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, padding 0.4s ease-out, margin 0.4s ease-out;
            opacity: 0;
        }

        .form-wrapper.visible {
            max-height: 2000px; /* Suficiente espacio para expandirse */
            opacity: 1;
            padding-top: 30px;
        }

        /* --- FORMULARIO DE AGREGAR PROPIEDAD --- */
        .form-section {
            background: var(--main-black);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
        }

        .form-section h2 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-left: 3px solid var(--primary-red);
            padding-left: 10px;
        }

        .property-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .form-group input, .form-group select, .form-group textarea {
            padding: 10px 12px;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: white;
            font-size: 0.85rem;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--primary-red);
        }

        .form-group textarea {
            resize: vertical;
            height: 80px;
        }

        .btn-submit {
            grid-column: 1 / -1;
            background: var(--primary-red);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: var(--dark-red);
        }

        /* --- 2. BARRA DE FILTROS (SUB-HEADER) --- */
        .filters-bar {
            background: var(--main-black);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 0;
            position: sticky;
            top: 0;
            z-index: 900;
        }

        .filters-container {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 240px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--text-light);
            outline: none;
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .filter-select {
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--text-light);
            background: var(--card-black);
            cursor: pointer;
            outline: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .filter-select:hover {
            background: #252525;
        }

        .filter-select.active {
            background-color: var(--primary-red);
            color: white;
            border-color: var(--primary-red);
        }

        /* --- 3. CONTENIDO PRINCIPAL --- */
        .main-content {
            padding: 30px 0;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 25px;
        }

        .title-section h1 {
            font-size: 1.4rem;
            color: #ffffff;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .breadcrumb {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .results-count {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .view-actions {
            display: flex;
            gap: 10px;
        }

        .btn-view {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            background: var(--card-black);
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--text-light);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .btn-view:hover {
            background: #252525;
        }

        /* --- 4. TARJETAS DE INMUEBLES (HORIZONTAL) --- */
        .properties-list {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .property-card {
            display: flex;
            background: var(--card-black);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .property-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(230, 57, 70, 0.15);
            border-color: #3a3a3a;
        }

        /* Zona Izquierda: Imagen del Inmueble */
        .card-image-wrapper {
            width: 35%;
            position: relative;
            min-width: 280px;
            background-size: cover;
            background-position: center;
        }

        .badges-container {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            gap: 8px;
        }

        .badge-status {
            background: rgba(17, 17, 17, 0.9);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1px solid var(--border-color);
        }

        .badge-status.featured {
            border-color: var(--primary-red);
            color: var(--primary-red);
        }

        .badge-status i.fa-star { color: var(--primary-red); }
        .badge-status i.fa-building { color: var(--text-light); }

        .image-nav {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
            transform: translateY(-50%);
        }

        .nav-arrow {
            background: rgba(17, 17, 17, 0.7);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: white;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .image-counter {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
        }

        /* Zona Derecho: Información */
        .card-content {
            flex: 1;
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        .branding-header {
            background: #222222;
            padding: 8px 20px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary-red);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-color);
        }

        .card-body-details {
            padding: 20px;
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .brand-logo-box {
            position: absolute;
            top: 20px;
            right: 20px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 4px 12px;
            background: var(--main-black);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 36px;
        }

        .brand-logo-box span {
            font-size: 0.75rem;
            font-weight: 700;
            color: white;
            letter-spacing: 0.5px;
        }

        .brand-logo-box span em {
            color: var(--primary-red);
            font-style: normal;
        }

        .property-price {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .property-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 400;
            margin-bottom: 15px;
        }

        .property-specs {
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 20px;
        }

        .property-specs span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .property-specs span i {
            color: var(--primary-red);
        }

        .property-description-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        /* Acciones de Contacto */
        .contact-actions {
            margin-top: auto;
            display: flex;
            gap: 15px;
        }

        .btn-action {
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            border: none;
            transition: background 0.2s, color 0.2s;
        }

        .btn-contact {
            background-color: var(--primary-red);
            color: white;
        }

        .btn-contact:hover {
            background-color: var(--dark-red);
        }

        .btn-call {
            background-color: transparent;
            border: 1px solid var(--primary-red);
            color: var(--primary-red);
        }

        .btn-call:hover {
            background: var(--primary-red);
            color: white;
        }

        /* Responsivo */
        @media (max-width: 850px) {
            .property-card {
                flex-direction: column;
            }
            .card-image-wrapper {
                width: 100%;
                height: 220px;
            }
            .brand-logo-box {
                top: auto;
                bottom: 75px;
            }
            .nav-menu {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- 1. NAVBAR GENERAL -->
    <header>
        <div class="container navbar">
            <div class="logo">Zentrum<span>.</span></div>
            <ul class="nav-menu">
                <li><a href="proyectoviviendas.html">Proyectos de vivienda</a></li>
                <li><a href="venta.html">Venta</a></li>
                <li><a href="arriendo.html">Arriendo</a></li>
                <li><a href="home.html">Noticias</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
            </ul>
            <div class="nav-actions">
                <button class="btn-publish" id="toggleFormBtn">Publica tu propiedad</button>
                <div class="user-profile">
                    <i class="fa-regular fa-user"></i>
                    <span>johao grisales</span>
                </div>
            </div>
        </div>
    </header>

    <!-- 2. BARRA DE FILTROS SUB-HEADER -->
    <div class="filters-bar">
        <div class="container filters-container">
            <div class="search-box">
                <input type="text" placeholder="Busca por ubicación o palabra clave">
            </div>
            <button class="filter-select active">Venta <i class="fa-solid fa-chevron-down"></i></button>
            <button class="filter-select">Tipo de Propiedad <i class="fa-solid fa-chevron-down"></i></button>
            <button class="filter-select">Precio <i class="fa-solid fa-chevron-down"></i></button>
            <button class="filter-select">Habs. y baños <i class="fa-solid fa-chevron-down"></i></button>
            <button class="filter-select"><i class="fa-solid fa-sliders"></i> Más filtros</button>
        </div>
    </div>

    <!-- SECCIÓN DEL FORMULARIO DINÁMICO (AHORA EN CAJA COLAPSABLE EXTRAÍDA DEL MAIN PARA MEJOR FLUJO) -->
    <div class="container form-wrapper" id="formWrapper">
        <div class="form-section">
            <h2>Publicar nuevo inmueble en Primate</h2>
            <form id="addPropertyForm" class="property-form">
                <div class="form-group">
                    <label>Categoría de Marca</label>
                    <select id="formBranding" required>
                        <option value="PRIMATE EXCLUSIVE">PRIMATE EXCLUSIVE</option>
                        <option value="PRIMATE PREMIUM">PRIMATE PREMIUM</option>
                        <option value="PRIMATE STANDARD">PRIMATE STANDARD</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Precio (Ej: $ 450.000.000)</label>
                    <input type="text" id="formPrice" placeholder="Desde $ 2.000.000" required>
                </div>
                <div class="form-group">
                    <label>Ubicación (Ej: Apartamento en Medellín)</label>
                    <input type="text" id="formLocation" placeholder="Apartamento en..." required>
                </div>
                <div class="form-group">
                    <label>URL de la Imagen</label>
                    <input type="url" id="formImageUrl" placeholder="https://images.unsplash.com/..." required>
                </div>
                <div class="form-group">
                    <label>Habitaciones</label>
                    <input type="number" id="formBeds" placeholder="Ej: 3" required>
                </div>
                <div class="form-group">
                    <label>Baños</label>
                    <input type="number" id="formBaths" placeholder="Ej: 2" required>
                </div>
                <div class="form-group">
                    <label>Área (m²)</label>
                    <input type="text" id="formArea" placeholder="Ej: 85.00" required>
                </div>
                <div class="form-group">
                    <label>Etiqueta Especial</label>
                    <select id="formTag">
                        <option value="DESTACADO">DESTACADO</option>
                        <option value="NUEVO">NUEVO</option>
                        <option value="OPORTUNIDAD">OPORTUNIDAD</option>
                    </select>
                </div>
                <div class="form-group full-width">
                    <label>Descripción detallada</label>
                    <textarea id="formDescription" placeholder="Describe las ventajas y características principales del inmueble..." required></textarea>
                </div>
                <button type="submit" class="btn-submit">Generar Tarjeta de Inmueble</button>
            </form>
        </div>
    </div>

    <!-- 3. CONTENIDO PRINCIPAL -->
    <main class="container main-content">
        
        <div class="results-header">
            <div class="title-section">
                <div class="breadcrumb">Estás en: Primate > Venta</div>
                <h1>Inmuebles en Venta</h1>
                <div class="results-count">Mostrando <strong id="currentCount">1-2</strong> de más de <strong id="totalCount">400</strong> resultados</div>
            </div>
            <div class="view-actions">
                <button class="btn-view"><i class="fa-solid fa-arrow-down-short-wide"></i> Popularidad</button>
                <button class="btn-view"><i class="fa-solid fa-map"></i> Ver Mapa</button>
            </div>
        </div>

        <!-- LISTA DE INMUEBLES -->
        <div class="properties-list" id="propertiesContainer">
            <!-- Las tarjetas quemadas por defecto y las guardadas en LocalStorage se inyectarán dinámicamente aquí -->
        </div>
    </main>

    <!-- LOGICA EN JAVASCRIPT -->
    <script>
        // --- TARJETAS BASE POR DEFECTO ---
        const defaultProperties = [
            {
                branding: "PRIMATE EXCLUSIVE",
                price: "Desde $ 2.773.321.000",
                locationStr: "Apartamento en Tucacas, Venezuela",
                imageUrl: "https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=600&q=80",
                beds: "5",
                baths: "6",
                area: "297.47",
                tag: "DESTACADO",
                description: "Reserva De finca, ubicada en el sector de Tucacas, estado Falcón, Venezuela. La propiedad cuenta con una extensión de 1.000 hectáreas, con acceso a la playa y vistas panorámicas al mar Caribe. Ideal para desarrollo turístico o residencial exclusivo."
            },
            {
                branding: "PRIMATE PREMIUM",
                price: "$ 450.000.000",
                locationStr: "Apartamento en Caracas, Venezuela",
                imageUrl: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=600&q=80",
                beds: "3",
                baths: "2",
                area: "85.00",
                tag: "DESTACADO",
                description: "Edificio Sendero Azul, Sector Residencial Exclusivo"
            }
        ];

        // --- MANEJO DEL FORMULARIO DESPLEGABLE ---
        const toggleFormBtn = document.getElementById('toggleFormBtn');
        const formWrapper = document.getElementById('formWrapper');

        toggleFormBtn.addEventListener('click', () => {
            formWrapper.classList.toggle('visible');
            if(formWrapper.classList.contains('visible')) {
                toggleFormBtn.innerText = "Cerrar Formulario";
                toggleFormBtn.style.background = "#2a2a2a";
            } else {
                toggleFormBtn.innerText = "Publica tu propiedad";
                toggleFormBtn.style.background = "var(--primary-red)";
            }
        });

        // --- RENDERIZADO DE PROPIEDADES CON LOCALSTORAGE ---
        const container = document.getElementById('propertiesContainer');

        function getStoredProperties() {
            const stored = localStorage.getItem('primate_sales');
            return stored ? JSON.parse(stored) : [];
        }

        function updateCounter() {
            const totalCards = container.getElementsByClassName('property-card').length;
            document.getElementById('currentCount').innerText = `1-${totalCards}`;
        }

        function createCardHTML(prop) {
            return `
                <div class="property-card">
                    <div class="card-image-wrapper" style="background-image: url('${prop.imageUrl}');">
                        <div class="badges-container">
                            <span class="badge-status featured"><i class="fa-solid fa-star"></i> ${prop.tag}</span>
                            <span class="badge-status"><i class="fa-solid fa-building"></i></span>
                        </div>
                        <div class="image-nav">
                            <span class="nav-arrow"><i class="fa-solid fa-chevron-left"></i></span>
                            <span class="nav-arrow"><i class="fa-solid fa-chevron-right"></i></span>
                        </div>
                        <div class="image-counter">1 / 1</div>
                    </div>
                    <div class="card-content">
                        <div class="branding-header">${prop.branding}</div>
                        <div class="card-body-details">
                            <div class="brand-logo-box">
                                <span>PRIMA<em>T</em>E</span>
                            </div>
                            <div class="property-price">${prop.price}</div>
                            <div class="property-subtitle">${prop.locationStr}</div>
                            <div class="property-specs">
                                <span><i class="fa-solid fa-bed"></i> ${prop.beds} Habs.</span>
                                <span><i class="fa-solid fa-bath"></i> ${prop.baths} Baños</span>
                                <span><i class="fa-solid fa-maximize"></i> ${prop.area} m²</span>
                            </div>
                            <div class="property-description-title">
                                ${prop.description}
                            </div>
                            <div class="contact-actions">
                                <button class="btn-action btn-contact"><i class="fa-regular fa-envelope"></i> Contactar</button>
                                <button class="btn-action btn-call"><i class="fa-solid fa-phone"></i> Llamar</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAllProperties() {
            container.innerHTML = "";
            const savedProps = getStoredProperties();
            
            // Renderizar primero los guardados por el usuario (más nuevos arriba)
            savedProps.forEach(prop => {
                container.insertAdjacentHTML('beforeend', createCardHTML(prop));
            });

            // Renderizar las propiedades estáticas por defecto al final
            defaultProperties.forEach(prop => {
                container.insertAdjacentHTML('beforeend', createCardHTML(prop));
            });

            updateCounter();
        }

        // --- ESCUCHA DEL SUBMIT DEL FORMULARIO ---
        document.getElementById('addPropertyForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Capturar datos del objeto
            const newProperty = {
                branding: document.getElementById('formBranding').value,
                price: document.getElementById('formPrice').value,
                locationStr: document.getElementById('formLocation').value,
                imageUrl: document.getElementById('formImageUrl').value,
                beds: document.getElementById('formBeds').value,
                baths: document.getElementById('formBaths').value,
                area: document.getElementById('formArea').value,
                tag: document.getElementById('formTag').value,
                description: document.getElementById('formDescription').value
            };

            // Guardar en la lista existente de LocalStorage
            const currentList = getStoredProperties();
            currentList.unshift(newProperty); // Inserta el nuevo al principio del storage
            localStorage.setItem('primate_sales', JSON.stringify(currentList));

            // Volver a renderizar la lista completa
            renderAllProperties();

            // Limpiar y ocultar formulario de nuevo
            document.getElementById('addPropertyForm').reset();
            toggleFormBtn.click(); 
        });

        // Carga inicial al abrir la página
        renderAllProperties();
    </script>
</body>
</html>
