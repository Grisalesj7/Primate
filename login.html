<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Zentrum Inmobiliaria</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-red: #e61e2b;
            --hover-red: #b3121b;
            --dark-bg: #0a0a0a;
            --card-bg: rgba(20, 20, 20, 0.75);
            --border-dark: #262626;
            --text-muted: #aaaaaa;
            --card-shadow: 0 8px 32px rgba(230, 30, 43, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            color: #ffffff;
            background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.9)), 
                        url('https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .auth-container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-dark);
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            box-shadow: var(--card-shadow);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .logo span {
            color: var(--primary-red);
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-icon-wrapper {
            position: relative;
        }

        .input-icon-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-red);
            font-size: 1rem;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px 12px 45px;
            background: #111111;
            border: 1px solid var(--border-dark);
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary-red);
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            margin-bottom: 25px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .remember-me input {
            accent-color: var(--primary-red);
        }

        .forgot-password {
            color: var(--text-muted);
            transition: color 0.3s;
        }

        .forgot-password:hover {
            color: var(--primary-red);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary-red);
            color: white;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background 0.3s, transform 0.2s;
            margin-bottom: 20px;
        }

        .btn-submit:hover {
            background-color: var(--hover-red);
            transform: translateY(-2px);
        }

        /* --- NUEVOS ESTILOS: INICIO DE SESIÓN SOCIAL --- */
        .separator {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .separator::before,
        .separator::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-dark);
        }

        .separator:not(:empty)::before {
            margin-right: .5em;
        }

        .separator:not(:empty)::after {
            margin-left: .5em;
        }

        .social-buttons-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 11px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s, transform 0.2s;
            background: #111111;
            border: 1px solid var(--border-dark);
            color: #ffffff;
        }

        .btn-social i {
            font-size: 1.1rem;
        }

        .btn-social.google-btn:hover {
            background: #1f1f1f;
            border-color: #4285F4;
            transform: translateY(-1px);
        }

        .btn-social.apple-btn:hover {
            background: #1f1f1f;
            border-color: #ffffff;
            transform: translateY(-1px);
        }
        /* ----------------------------------------------- */

        .auth-footer {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--primary-red);
            font-weight: 600;
            transition: color 0.3s;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .alert-error {
            background-color: rgba(230, 30, 43, 0.15);
            border: 1px solid var(--primary-red);
            color: #ff4d5a;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 15px;
            display: none;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <div class="logo">Zentrum<span> Inmobiliaria</span></div>
            <p>Ingresa tu cuenta, mira los servicios que te podemos ofrecer</p>
        </div>

        <div id="errorBox" class="alert-error"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="log-email">Correo Electrónico</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="log-email" name="login_correo" class="form-control" placeholder="ejemplo@zentrum.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="log-password">Contraseña</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="log-password" name="login_password" class="form-control" placeholder="Escribe tu contraseña" required>
                </div>
            </div>

            <div class="form-actions">
                <label class="remember-me">
                    <input type="checkbox" name="recordarme"> Recordarme
                </label>
                <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-submit">Iniciar Sesión</button>
        </form>

        <div class="separator">o continuar con</div>

        <div class="social-buttons-container">
            <button type="button" id="googleLoginBtn" class="btn-social google-btn">
                <i class="fa-brands fa-google" style="color: #ea4335;"></i> Google
            </button>
            <button type="button" id="appleLoginBtn" class="btn-social apple-btn">
                <i class="fa-brands fa-apple"></i> Apple
            </button>
        </div>

        <div class="auth-footer">
            <p>¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('log-email').value.trim().toLowerCase();
            const password = document.getElementById('log-password').value;
            const errorBox = document.getElementById('errorBox');

            errorBox.style.display = 'none';

            const users = JSON.parse(localStorage.getItem('zentrum_users')) || [];
            const validUser = users.find(user => user.email === email);

            if (!validUser) {
                errorBox.textContent = "El correo electrónico no se encuentra registrado.";
                errorBox.style.display = 'block';
                return;
            }

            if (validUser.password !== password) {
                errorBox.textContent = "Contraseña incorrecta. Inténtalo de nuevo.";
                errorBox.style.display = 'block';
                return;
            }

            sessionStorage.setItem('active_user', JSON.stringify({ name: validUser.name, email: validUser.email }));
            window.location.href = 'dashboard.html';
        });

        // Eventos para simular el click de los botones sociales (para cuando integres Firebase o Auth0)
        document.getElementById('googleLoginBtn').addEventListener('click', function() {
            console.log('Iniciando flujo con Google Auth...');
            // Aquí irá tu lógica de SDK de Google, Firebase Auth, supabase, etc.
        });

        document.getElementById('appleLoginBtn').addEventListener('click', function() {
            console.log('Iniciando flujo con Apple Auth...');
            // Aquí irá tu lógica de SDK de Apple
        });
    </script>
</body>
</html>
