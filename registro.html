<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Zentrum Inmobiliaria</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-red: #e61e2b;
            --hover-red: #b3121b;
            --dark-bg: #0a0a0a;
            --card-bg: rgba(20, 20, 20, 0.75);
            --border-dark: #262626;
            --text-muted: #aaaaaa;
            --card-shadow: 0 8px 32px rgba(230, 30, 43, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            color: #ffffff;
            background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.9)), 
                        url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .auth-container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-dark);
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: var(--card-shadow);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .logo span {
            color: var(--primary-red);
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-icon-wrapper {
            position: relative;
        }

        .input-icon-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-red);
            font-size: 1rem;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px 12px 45px;
            background: #111111;
            border: 1px solid var(--border-dark);
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary-red);
        }

        .terms-condition {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.85rem;
            margin-bottom: 25px;
            color: var(--text-muted);
            cursor: pointer;
            line-height: 1.4;
        }

        .terms-condition input {
            accent-color: var(--primary-red);
            margin-top: 3px;
        }

        .terms-condition a {
            color: var(--primary-red);
            font-weight: 500;
        }

        .terms-condition a:hover {
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary-red);
            color: white;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background 0.3s, transform 0.2s;
            margin-bottom: 20px;
        }

        .btn-submit:hover {
            background-color: var(--hover-red);
            transform: translateY(-2px);
        }

        /* --- NUEVOS ESTILOS: REGISTRO SOCIAL --- */
        .separator {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .separator::before,
        .separator::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-dark);
        }

        .separator:not(:empty)::before {
            margin-right: .5em;
        }

        .separator:not(:empty)::after {
            margin-left: .5em;
        }

        .social-buttons-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 11px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s, transform 0.2s;
            background: #111111;
            border: 1px solid var(--border-dark);
            color: #ffffff;
        }

        .btn-social i {
            font-size: 1.1rem;
        }

        .btn-social.google-btn:hover {
            background: #1f1f1f;
            border-color: #4285F4;
            transform: translateY(-1px);
        }

        .btn-social.apple-btn:hover {
            background: #1f1f1f;
            border-color: #ffffff;
            transform: translateY(-1px);
        }
        /* ----------------------------------------------- */

        .auth-footer {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--primary-red);
            font-weight: 600;
            transition: color 0.3s;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        /* Mensajes dinámicos de error o éxito */
        .alert-message {
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 15px;
            display: none;
            text-align: center;
            font-weight: 500;
        }
        
        .alert-error {
            background-color: rgba(230, 30, 43, 0.15);
            border: 1px solid var(--primary-red);
            color: #ff4d5a;
        }
        
        .alert-success {
            background-color: rgba(46, 204, 113, 0.15);
            border: 1px solid #2ecc71;
            color: #2ecc71;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <div class="logo">Zentrum<span> Inmobiliaria</span></div>
            <p>Crea una cuenta y descubre el poder de encontrar tu hogar</p>
        </div>

        <!-- Contenedor de alertas -->
        <div id="alertBox" class="alert-message alert-error"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="reg-name">Nombre Completo</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="reg-name" name="nombre" class="form-control" placeholder="Tu nombre y apellido" required>
                </div>
            </div>

            <div class="form-group">
                <label for="reg-email">Correo Electrónico</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="reg-email" name="correo" class="form-control" placeholder="ejemplo@zentrum.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="reg-password">Contraseña</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="reg-password" name="password" class="form-control" placeholder="Mínimo 8 caracteres" minlength="8" required>
                </div>
            </div>

            <div class="form-group">
                <label for="reg-confirm-password">Confirmar Contraseña</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-shield-halved"></i>
                    <input type="password" id="reg-confirm-password" name="confirm_password" class="form-control" placeholder="Repite tu contraseña" required>
                </div>
            </div>

            <label class="terms-condition">
                <input type="checkbox" name="terminos" required>
                <span>Acepto los <a href="#">Términos de Servicio</a> y las <a href="#">Políticas de Privacidad</a> de Zentrum Inmobiliaria.</span>
            </label>

            <button type="submit" class="btn-submit">Crear Cuenta</button>
        </form>

        <!-- SEPARADOR VISUAL -->
        <div class="separator">o registrarse con</div>

        <!-- BOTONES SOCIALES DE REGISTRO -->
        <div class="social-buttons-container">
            <button type="button" id="googleRegisterBtn" class="btn-social google-btn">
                <i class="fa-brands fa-google" style="color: #ea4335;"></i> Google
            </button>
            <button type="button" id="appleRegisterBtn" class="btn-social apple-btn">
                <i class="fa-brands fa-apple"></i> Apple
            </button>
        </div>

        <div class="auth-footer">
            <p>¿Ya tienes una cuenta? <a href="login.html">Inicia Sesión</a></p>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Evita que la página se recargue

            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim().toLowerCase();
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm-password').value;
            const alertBox = document.getElementById('alertBox');

            // Ocultar alertas previas
            alertBox.style.display = 'none';

            // 1. Validar que las contraseñas coincidan
            if (password !== confirmPassword) {
                alertBox.className = "alert-message alert-error";
                alertBox.textContent = "Las contraseñas no coinciden.";
                alertBox.style.display = 'block';
                return;
            }

            // 2. Obtener usuarios ya existentes o inicializar lista vacía
            let users = JSON.parse(localStorage.getItem('zentrum_users')) || [];

            // 3. Validar si el correo ya está registrado
            const userExists = users.some(user => user.email === email);
            if (userExists) {
                alertBox.className = "alert-message alert-error";
                alertBox.textContent = "Este correo electrónico ya está registrado.";
                alertBox.style.display = 'block';
                return;
            }

            // 4. Guardar el nuevo usuario
            users.push({ name: name, email: email, password: password });
            localStorage.setItem('zentrum_users', JSON.stringify(users));

            // 5. Mostrar éxito y redirigir
            alertBox.className = "alert-message alert-success";
            alertBox.textContent = "¡Registro exitoso! Redirigiendo al inicio de sesión...";
            alertBox.style.display = 'block';

            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        });

        // Eventos para controlar los flujos de registro externo (OAuth / SDKs futuros)
        document.getElementById('googleRegisterBtn').addEventListener('click', function() {
            console.log('Iniciando registro rápido con cuenta de Google...');
            // Implementación de backend / Firebase aquí
        });

        document.getElementById('appleRegisterBtn').addEventListener('click', function() {
            console.log('Iniciando registro rápido con cuenta de Apple...');
            // Implementación de backend / SDK Apple aquí
        });
    </script>
</body>
</html>
